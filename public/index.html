<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agentic OS</title>
<link rel="icon" href="/robot.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="brand">
      <img class="bot" src="/robot.svg" alt="">
      <h1 class="keep-ls"><span class="a">AGENTIC</span><span class="o">OS</span></h1>
    </div>
    <div class="top-right">
      <div class="meta" id="meta"></div>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="fa" lang="fa">فا</button><button data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <nav class="nav">
    <button class="nb primary" data-open="claude"><i>◆</i><span data-i18n="claudeCode">CLAUDE CODE</span><span class="ext">↗</span></button>
    <button class="nb" data-open="vault"><i>✱</i><span data-i18n="vaultBtn">VAULT</span></button>
    <button class="nb" data-open="daily"><i>§</i><span data-i18n="dailyNote">DAILY NOTE</span></button>
    <button class="nb" data-open="runs"><i>¶</i><span data-i18n="runsFolder">RUNS FOLDER</span></button>
    <button class="nb" data-open="drafts"><i>※</i><span data-i18n="drafts">DRAFTS</span></button>
    <button class="nb" data-open="widget"><i>▣</i><span data-i18n="widget">WIDGET</span></button>
  </nav>

  <section class="tiles">
    <div class="card tile" id="t-5h"></div>
    <div class="card tile" id="t-week"></div>
    <div class="card tile" id="t-routines"></div>
  </section>

  <section class="card chart-card">
    <div class="chart-head">
      <span class="lbl" data-i18n="activity">AGENTIC OS · CUMULATIVE ACTIVITY · 30D</span>
      <span class="lbl" id="total"></span>
    </div>
    <div class="chart" id="chart"></div>
  </section>

  <section class="card integ">
    <span class="accent-lbl" data-i18n="integrations">INTEGRATIONS</span>
    <span class="vsep"></span>
    <div class="integ-list" id="integ"></div>
  </section>

  <hr class="rule">

  <section class="bottom">
    <div class="card last" id="last"></div>
    <div class="card recent">
      <div class="accent-lbl" data-i18n="recentRuns">RECENT RUNS</div>
      <ul id="recent"></ul>
    </div>
  </section>

  <section class="block">
    <div class="block-head"><span class="accent-lbl" data-i18n="skills">SKILLS</span><span class="lbl" id="skills-note"></span></div>
    <div class="domains" id="skills"></div>
  </section>

  <section class="duo">
    <div class="card list-card">
      <div class="accent-lbl" data-i18n="upcoming">UPCOMING · 24H</div>
      <ul id="upcoming"></ul>
    </div>
    <div class="card list-card">
      <div class="accent-lbl" data-i18n="changes">VAULT CHANGES · 48H</div>
      <ul id="changes"></ul>
    </div>
  </section>
</main>

<div class="modal" id="modal" hidden>
  <div class="card modal-box" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <div class="lbl" id="m-title"></div>
    <p class="m-desc" id="m-desc" dir="auto"></p>
    <div class="tiers" id="m-tiers" role="radiogroup" aria-label="Model"></div>
    <textarea id="m-prompt" spellcheck="false" rows="7" dir="ltr"></textarea>
    <div class="m-actions">
      <button class="nb" id="m-cancel"><span data-i18n="cancel">CANCEL</span></button>
      <button class="nb primary" id="m-run"><i>▸</i><span data-i18n="runHeadless">RUN HEADLESS</span></button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
